# Run once as part of status setup, and again to verify it. The probe owns all three schedules.
name: Set up status timer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-timer-setup
  cancel-in-progress: false
jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
      - run: node checks/scripts/setup-timer.ts
        env:
          FLEET_PROBE_TOKEN: ${{ secrets.FLEET_PROBE_TOKEN }}
