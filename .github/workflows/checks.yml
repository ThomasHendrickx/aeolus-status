# Pinned by hand. The checks Upptime cannot make: each opens or closes the same `status` issues Upptime does.
# Cadences: every 5 minutes and every 15 minutes. A manual run takes the cadence it is given.
name: Checks
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      accept_probe_terms:
        description: "Accept the probe account terms and privacy notice once"
        type: boolean
        required: true
        default: false
      cadence:
        description: "five or fifteen"
        required: true
        default: five
permissions:
  contents: read
  issues: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CADENCE: ${{ github.event.inputs.cadence || (github.event.schedule == '*/5 * * * *' && 'five') || 'fifteen' }}
    concurrency:
      group: checks-${{ github.event.inputs.cadence || github.event.schedule }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: checks/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          node --input-type=module <<'JS'
          import { realContext } from './src/context.ts';
          import { signInFresh, closeSession, urlOf } from './src/session.ts';
          const context = realContext();
          try {
            const session = await signInFresh(context, AbortSignal.timeout(200000));
            const page = await session.context.newPage();
            await page.goto(`${urlOf(context, 'account')}/organisation/fleets`);
            console.log('diagnostic: organisation fleet page offered console buttons=' + await page.getByRole('button', {name: 'Open in console', exact: true}).count());
            console.log('diagnostic: organisation fleet page not found=' + await page.getByText('This page could not be found.', {exact: true}).count());
            await page.goto(`${urlOf(context, 'app')}/sign-in/start`);
            try { await page.waitForURL(u => u.origin === new URL(urlOf(context, 'app')).origin && !u.pathname.startsWith('/sign-in'), {timeout: 20000}); } catch {}
            const u = new URL(page.url());
            console.log('diagnostic: app signed-in destination=' + (u.origin === new URL(urlOf(context, 'app')).origin && !u.pathname.startsWith('/sign-in')));
            console.log('diagnostic: app sign-in failure page=' + (u.pathname === '/sign-in/failed'));
            console.log('diagnostic: account organisation chooser=' + await page.getByRole('heading', {name:'Choose your organisation', exact:true}).count());
            console.log('diagnostic: app sign-in continue buttons=' + await page.getByTestId('sign-in-continue').count());
          } catch { console.log('diagnostic: session or navigation failed'); process.exitCode = 1; }
          finally { await closeSession(context); }
          JS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEET_PROBE_TOKEN: ${{ secrets.FLEET_PROBE_TOKEN }}
          PROBE_MAIL_ADDRESS: ${{ secrets.PROBE_MAIL_ADDRESS }}
          PROBE_MAIL_PASSWORD: ${{ secrets.PROBE_MAIL_PASSWORD }}
          PROBE_ORGANISATION: ${{ vars.PROBE_ORGANISATION }}
          ACCEPT_PROBE_TERMS: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_probe_terms && 'true' || 'false' }}
