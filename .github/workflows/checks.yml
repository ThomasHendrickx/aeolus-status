# Pinned by hand. The checks Upptime cannot make: each opens or closes the same `status` issues Upptime does.
# Cadences: every 5 minutes and every 15 minutes. A manual run takes the cadence it is given.
name: Checks
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      accept_probe_terms:
        description: "Accept the probe account terms and privacy notice once"
        type: boolean
        required: true
        default: false
      cadence:
        description: "five or fifteen"
        required: true
        default: five
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CADENCE: ${{ github.event.inputs.cadence || (github.event.schedule == '*/5 * * * *' && 'five') || 'fifteen' }}
    concurrency:
      group: checks-${{ github.ref }}-${{ github.event.inputs.cadence || (github.event.schedule == '*/5 * * * *' && 'five') || 'fifteen' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: checks/package-lock.json
      - name: Identify UTC slot
        id: slot
        run: node scripts/slot.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: done
        with:
          path: .status-slot
          key: status-slot-checks-${{ github.ref }}-${{ steps.slot.outputs.key }}
      - run: npm ci
        if: steps.done.outputs.cache-hit != 'true' || inputs.accept_probe_terms
      - run: npx playwright install --with-deps chromium
        if: steps.done.outputs.cache-hit != 'true' || inputs.accept_probe_terms
      - run: node src/run.ts "$CADENCE"
        if: steps.done.outputs.cache-hit != 'true' || inputs.accept_probe_terms
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEET_PROBE_TOKEN: ${{ secrets.FLEET_PROBE_TOKEN }}
          PROBE_MAIL_ADDRESS: ${{ secrets.PROBE_MAIL_ADDRESS }}
          PROBE_MAIL_PASSWORD: ${{ secrets.PROBE_MAIL_PASSWORD }}
          PROBE_ORGANISATION: ${{ vars.PROBE_ORGANISATION }}
          ACCEPT_PROBE_TERMS: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_probe_terms && 'true' || 'false' }}
      - run: mkdir -p ../.status-slot && touch ../.status-slot/done
        if: steps.done.outputs.cache-hit != 'true'
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.done.outputs.cache-hit != 'true'
        with:
          path: .status-slot
          key: status-slot-checks-${{ github.ref }}-${{ steps.slot.outputs.key }}
