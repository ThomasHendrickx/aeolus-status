# Pinned by hand. The checks Upptime cannot make: each opens or closes the same `status` issues Upptime does.
# Cadences: every 5 minutes and every 15 minutes. A manual run takes the cadence it is given.
name: Checks
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      cadence:
        description: "five or fifteen"
        required: true
        default: five
permissions:
  contents: read
  issues: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CADENCE: ${{ github.event.inputs.cadence || (github.event.schedule == '*/5 * * * *' && 'five') || 'fifteen' }}
    concurrency:
      group: checks-${{ github.event.inputs.cadence || github.event.schedule }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: checks/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diagnose sign-in destination without private data
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'src/session.ts';
          const source = readFileSync(file, 'utf8');
          const diagnostic = `
                const here = new URL(page.url());
                console.log('sign-in diagnostic', JSON.stringify({
                  accountOrigin: here.origin === new URL(account).origin,
                  accountHome: here.pathname === '/account',
                  bridge: here.origin === new URL(urlOf(context, 'gateway')).origin && here.pathname === '/bridge',
                  stillOnLink: here.pathname === '/sign-in/link',
                  askedToSignIn: here.pathname === '/sign-in',
                  sessionCookiePresent: (await browserContext.cookies()).some(cookie => cookie.name === 'aeolus_account_session'),
                  failedNotice: await page.getByText('We couldn’t sign you in', { exact: true }).count(),
                  chooseOrganisation: await page.getByRole('heading', { name: 'Choose your organisation', exact: true }).count(),
                }));
                await page.goto(account + '/account');
                console.log('protected account diagnostic', JSON.stringify({
                  stayedOnAccount: new URL(page.url()).pathname === '/account',
                  askedToSignIn: new URL(page.url()).pathname === '/sign-in',
                  status: await page.locator('main').count(),
                }));
          `;
          writeFileSync(file, source.replace("throw new Failure('the sign-in link did not sign in');", diagnostic + "throw new Failure('the sign-in link did not sign in');"));
          JS
      - run: node src/run.ts "$CADENCE"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEET_PROBE_TOKEN: ${{ secrets.FLEET_PROBE_TOKEN }}
          PROBE_MAIL_ADDRESS: ${{ secrets.PROBE_MAIL_ADDRESS }}
          PROBE_MAIL_PASSWORD: ${{ secrets.PROBE_MAIL_PASSWORD }}
